version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-10:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.Text.Json"
          - "System.Threading.Channels"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
